<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Employee Login | Tango ISO Solutions</title><link rel="icon" href="assets/img/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/erp.css"></head><body class="lgbody"><main class="lg"><a href="index.html"><img src="assets/img/logo.png" alt="Tango ISO Solutions" width="180" height="60"></a><h1>Employee Login</h1><p>Authorised employees only.</p>
<form id="lf"><div class="seg"><label><input type="radio" name="role" value="employee" checked><span>Employee</span></label><label><input type="radio" name="role" value="admin"><span>Admin</span></label></div><div class="fld"><label for="em">Email</label><input id="em" type="email" required autocomplete="username"></div><div class="fld"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password"></div><button class="b ok big" style="width:100%">Login</button><p id="lm" role="status"></p></form><a class="back" href="index.html">← Back to website</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script>
const sb=supabase.createClient('https://hihresztklcxlvcxzvjp.supabase.co','sb_publishable_KNEF2kOc4kPFiuhiT17T0g_wt9UpBxc'),lm=document.getElementById('lm'),show=(t,c)=>{lm.textContent=t;lm.className=c||''};
sb.auth.getSession().then(({data})=>{if(data.session)location.replace('erp.html')});
document.getElementById('lf').addEventListener('submit',async e=>{e.preventDefault();const role=e.target.role.value;show('Signing in…');
const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
if(error)return show('Invalid email or password.','err');
const {data:p}=await sb.from('profiles').select('role,active').eq('id',data.user.id).single();
if(!p||!p.active){await sb.auth.signOut();return show('Your account is not active. Please contact the administrator.','err')}
if(p.role!==role){await sb.auth.signOut();return show('This is not an '+role+' account. Choose the correct login option.','err')}
location.replace('erp.html')});</script></body></html>
